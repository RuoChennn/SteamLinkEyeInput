; Generic normalized OSC scalar input. Copy to steamlinkeyeinput/steamlinkeyeinput.ini.
; Set addresses and angular scales to match the input software/device.
[steamlinkeyeinput]
enabled=1
port=9100
flip_x=0
flip_y=0
yaw=35
pitch=30
depth=2
; Manual center trim in degrees, applied after axis flips. Range: -20 to 20.
offset_yaw=0
offset_pitch=0
address_EyeLeftX=/eyetracking/EyeLeftX
address_EyeRightX=/eyetracking/EyeRightX
address_EyeLeftY=/eyetracking/EyeLeftY
address_EyeRightY=/eyetracking/EyeRightY
address_EyeLidLeft=/eyetracking/EyeLidLeft
address_EyeLidRight=/eyetracking/EyeLidRight
