; Changes reload within 0.5 seconds. enabled=0 stops gaze input; enabled=1 resumes.
; Upstream calibration plus optional manual angular center trim.
[steamlinkeyeinput]
enabled=1
show_gaze_center=0
port=9100
flip_x=0
flip_y=0
yaw=35
pitch=30
; Directional amplitude multipliers, AFTER manual center trim. 1 = 100%.
; Range: 0.1 to 4. Defaults preserve the existing mapping.
gain_left=1
gain_right=1
gain_up=1
gain_down=1
depth=2
; Manual center trim in degrees, applied after axis flips. Range: -20 to 20.
offset_yaw=0
offset_pitch=0

address_EyeLeftX=/papertracker/EyeLeftX
address_EyeRightX=/papertracker/EyeRightX
address_EyeLeftY=/papertracker/EyeLeftY
address_EyeRightY=/papertracker/EyeRightY
address_EyeLidLeft=/papertracker/EyeLidLeft
address_EyeLidRight=/papertracker/EyeLidRight
