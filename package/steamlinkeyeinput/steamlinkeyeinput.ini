; Changes reload within 0.5 seconds. enabled=0 stops gaze input; enabled=1 resumes.
; Calibration belongs to the upstream tracker; no plugin neutral offsets.
[steamlinkeyeinput]
enabled=1
port=9100
flip_x=0
flip_y=0
yaw=35
pitch=30
depth=2

address_EyeLeftX=/papertracker/EyeLeftX
address_EyeRightX=/papertracker/EyeRightX
address_EyeLeftY=/papertracker/EyeLeftY
address_EyeRightY=/papertracker/EyeRightY
address_EyeLidLeft=/papertracker/EyeLidLeft
address_EyeLidRight=/papertracker/EyeLidRight
